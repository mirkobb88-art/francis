<!DOCTYPE html>
<html>
<head>
<title> Francis la quiebra </title>
<style>
    body {
        background: linear-gradient(135deg, #0a1a0a 0%, #1a3a1a 100%);
        color: #e0ffe0;
        font-family: 'Courier New', Courier, monospace;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        transition: background 0.5s;
    }

    /* GLOW DEL MOUSE REPARADO */
    #glow {
        position: fixed;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(46, 204, 113, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
        border-radius: 50%;
        pointer-events: none;
        z-index: -2;
        transform: translate(-50%, -50%);
        transition: background 0.5s;
    }

    /* ONDAS DE BAJOS */
    .onda-bajos {
        position: absolute;
        border: 2px solid #2ecc71;
        border-radius: 25px;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        box-sizing: border-box;
        pointer-events: none;
        opacity: 0;
        z-index: -1;
    }

    .tarjeta {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(46, 204, 113, 0.3);
        padding: 40px;
        border-radius: 20px;
        max-width: 350px;
        box-shadow: 0px 20px 40px rgba(0,0,0,0.5);
        position: relative;
        z-index: 1;
        transition: transform 0.1s linear, background 0.5s;
    }

    /* MODO FIESTA ANIMADO */
    @keyframes lucesFiesta {
        0% { border-color: #2ecc71; box-shadow: 0 0 20px #2ecc71; }
        50% { border-color: #e74c3c; box-shadow: 0 0 30px #e74c3c; }
        100% { border-color: #f1c40f; box-shadow: 0 0 20px #f1c40f; }
    }

    .modo-fiesta-activa {
        animation: lucesFiesta 1.5s infinite alternate !important;
        background: rgba(255, 255, 255, 0.1) !important;
    }

    img {
        border-radius: 50%;
        border: 4px solid #2ecc71;
        width: 150px;
        height: 150px;
        object-fit: cover;
        margin-bottom: 20px; 
        box-shadow: 0px 0px 20px rgba(46, 204, 112, 0.6);
    }

    a {
        color: #2ecc71;
        text-decoration: none;
        font-weight: bold;
        display: inline-block;
        margin: 15px 0;
    }

    .musica-box {
        margin-top: 25px;
        padding: 15px;
        background: rgba(46, 204, 113, 0.1);
        border-radius: 12px;
        border: 1px dashed #2ecc71;
    }

    audio {
        width: 100%;
        height: 30px;
        filter: invert(100%) hue-rotate(90deg) brightness(1.5);
    }

    .contador-nuevo {
        margin-top: 20px;
        font-size: 10px;
        color: #2ecc71;
        letter-spacing: 2px;
    }

    #num-visitas {
        font-size: 22px;
        display: block;
        font-weight: bold;
        color: #fff;
        text-shadow: 0 0 10px #2ecc71;
    }

    .hojas-container {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        pointer-events: none;
    }

    .hoja {
        position: absolute;
        top: -50px;
        font-size: 25px;
        animation: caer linear infinite;
    }

    @keyframes caer {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
</style>
</head>
<body>
    <div id="glow"></div>

    <div class="hojas-container">
        <div class="hoja" style="left: 15%; animation-duration: 5s;">🌿</div>
        <div class="hoja" style="left: 45%; animation-duration: 8s;">🌿</div>
        <div class="hoja" style="left: 80%; animation-duration: 6s;">🌿</div>
    </div>

    <div class="tarjeta" id="miTarjeta">
        <div class="onda-bajos" id="onda1"></div>
        <div class="onda-bajos" id="onda2"></div>

        <img src="Captura.PNG" alt="Foto Francis"> 
        <h1> Soy Francis </h1>
        <p style="font-size: 12px;">La quiebra activa - Sitio Oficial</p>
        
        <a href="https://www.instagram.com/benites_francis/" target="_blank">📸 IR A MI INSTAGRAM</a>
        
        <div class="musica-box">
            <p id="statusMusica" style="font-size: 10px;">🎵 DALE PLAY PARA ACTIVAR</p>
            <audio id="track" controls>
                <source src="watussi.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="contador-nuevo">
            VECES VISITADA
            <span id="num-visitas">0000</span>
        </div>
    </div>

    <script>
        // --- 1. REFERENCIAS ---
        const audio = document.getElementById('track');
        const tarjeta = document.getElementById('miTarjeta');
        const status = document.getElementById('statusMusica');
        const glow = document.getElementById('glow');
        const onda1 = document.getElementById('onda1');
        const onda2 = document.getElementById('onda2');

        let audioCtx, analyser, dataArray, source;

        // --- 2. CONTADOR DE VISITAS (REPARADO) ---
        function actualizarContador() {
            let visitas = localStorage.getItem('visitas_francis') || 0;
            visitas = parseInt(visitas) + 1;
            localStorage.setItem('visitas_francis', visitas);
            document.getElementById('num-visitas').innerText = visitas.toString().padStart(4, '0');
        }
        actualizarContador();

        // --- 3. MOVIMIENTO DEL MOUSE (REPARADO) ---
        document.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        // --- 4. ANALIZADOR DE AUDIO Y ONDAS ---
        function activarVisualizador() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                source = audioCtx.createMediaElementSource(audio);
                analyser = audioCtx.createAnalyser();
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                loopVisual();
            } catch(e) { console.log("Error de audio:", e); }
        }

        function loopVisual() {
            requestAnimationFrame(loopVisual);
            if (!analyser) return;
            analyser.getByteFrequencyData(dataArray);
            
            let bajo = dataArray[0]; 
            let intensida = bajo / 255;

            // Vibración de tarjeta y ondas
            tarjeta.style.transform = `scale(${1 + intensida * 0.05})`;
            onda1.style.transform = `scale(${1 + intensida * 0.4})`;
            onda1.style.opacity = intensida;
            onda2.style.transform = `scale(${1 + intensida * 0.7})`;
            onda2.style.opacity = intensida * 0.5;
        }

        // --- 5. EVENTOS DE PLAY/PAUSE ---
        audio.onplay = () => {
            activarVisualizador();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            
            tarjeta.classList.add('modo-fiesta-activa');
            status.innerText = "🔥 ¡LA QUIEBRA ACTIVA! 🔥";
            document.body.style.background = "#000";
            glow.style.background = "radial-gradient(circle, rgba(231, 76, 60, 0.3) 0%, rgba(0, 0, 0, 0) 70%)";
        };

        audio.onpause = () => {
            tarjeta.classList.remove('modo-fiesta-activa');
            status.innerText = "🎵 ESCUCHANDO: WATUSSI";
            document.body.style.background = "linear-gradient(135deg, #0a1a0a 0%, #1a3a1a 100%)";
            glow.style.background = "radial-gradient(circle, rgba(46, 204, 113, 0.15) 0%, rgba(0, 0, 0, 0) 70%)";
            onda1.style.opacity = 0;
            onda2.style.opacity = 0;
        };
    </script>
</body> 
</html>
