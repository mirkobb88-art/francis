<!DOCTYPE html>
<html>
<head>
<title> Francis la quiebra </title>
<style>
    body {
        background: linear-gradient(135deg, #0a1a0a 0%, #1a3a1a 100%);
        color: #e0ffe0;
        font-family: 'Courier New', Courier, monospace;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        transition: background 0.5s;
    }

    /* EFECTO GLOW DEL MOUSE */
    .mouse-glow {
        position: fixed;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(46, 204, 113, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
        border-radius: 50%;
        pointer-events: none;
        z-index: -2;
        transform: translate(-50%, -50%);
        transition: background 0.5s, width 0.5s, height 0.5s;
    }

    @keyframes lucesFiesta {
        0% { border-color: #2ecc71; box-shadow: 0 0 20px #2ecc71; }
        33% { border-color: #e74c3c; box-shadow: 0 0 30px #e74c3c; }
        66% { border-color: #f1c40f; box-shadow: 0 0 30px #f1c40f; }
        100% { border-color: #9b59b6; box-shadow: 0 0 20px #9b59b6; }
    }

    .tarjeta {
        animation: aparecer 1s ease-out;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(46, 204, 113, 0.3);
        padding: 40px;
        border-radius: 20px;
        max-width: 350px;
        box-shadow: 0px 20px 40px rgba(0,0,0,0.5);
        position: relative;
        z-index: 1;
        transition: 0.5s;
    }

    .modo-fiesta-activa {
        animation: lucesFiesta 1.5s infinite alternate !important;
        transform: scale(1.05);
    }

    a {
        color: #2ecc71;
        text-decoration: none;
        font-weight: bold;
        display: inline-block;
        margin-top: 10px;
    }

    button {
        background-color: #27ae60;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 15px;
        box-shadow: 0px 4px 15px rgba(39, 174, 96, 0.4);
        transition: 0.3s;
        width: 100%;
    }

    button:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px #2ecc71;
    }

    .btn-alias {
        background-color: transparent;
        border: 1px solid #2ecc71;
        color: #2ecc71;
        font-size: 11px;
    }

    img {
        border-radius: 50%;
        border: 4px solid #2ecc71;
        width: 150px;
        height: 150px;
        object-fit: cover;
        margin-bottom: 20px; 
        box-shadow: 0px 0px 20px rgba(46, 204, 112,0.6);
    }

    .musica-box {
        margin-top: 25px;
        padding: 15px;
        background: rgba(46, 204, 113, 0.1);
        border-radius: 12px;
        border: 1px dashed #2ecc71;
    }

    audio {
        width: 100%;
        height: 30px;
        filter: invert(100%) hue-rotate(90deg) brightness(1.5);
    }

    /* CONTADOR ESTILO RETRO */
    .contador-nuevo {
        margin-top: 20px;
        font-size: 10px;
        color: #2ecc71;
    }

    #num-visitas {
        font-size: 20px;
        display: block;
        font-weight: bold;
        letter-spacing: 3px;
        color: #fff;
        text-shadow: 0 0 10px #2ecc71;
    }

    .hoja-fiesta {
        animation: caer 2s linear infinite, cambiarColor 1s infinite !important;
    }

    @keyframes cambiarColor {
        0% { filter: hue-rotate(0deg); }
        100% { filter: hue-rotate(360deg); }
    }

    @keyframes aparecer {
        from {opacity: 0; transform: translateY(30px);}
        to {opacity: 1; transform: translateY(0);}
    }

    .hojas-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: -1;
        pointer-events: none;
    }

    .hoja {
        position: absolute;
        top: -50px;
        font-size: 25px;
        user-select: none;
        animation: caer linear infinite;
    }

    @keyframes caer {
        0% { transform: translateY(0) rotate(0deg) translateX(0); opacity: 1; }
        100% { transform: translateY(110vh) rotate(720deg) translateX(50px); opacity: 0; }
    }
</style>
</head>
