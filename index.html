<!DOCTYPE html>
<html>
<head>
<title> Francis la quiebra </title>
<style>
    body {
        background: linear-gradient(135deg, #0a1a0a 0%, #1a3a1a 100%);
        color: #e0ffe0;
        font-family: 'Courier New', Courier, monospace;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        transition: background 0.5s;
    }

    /* GLOW DEL MOUSE */
    #glow {
        position: fixed;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(46, 204, 113, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
        border-radius: 50%;
        pointer-events: none;
        z-index: -2;
        transform: translate(-50%, -50%);
        transition: background 0.5s;
    }

    .tarjeta {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(46, 204, 113, 0.3);
        padding: 50px 40px; /* Un poco más de espacio arriba */
        border-radius: 20px;
        max-width: 350px;
        box-shadow: 0px 20px 40px rgba(0,0,0,0.5);
        position: relative;
        z-index: 1;
        transition: transform 0.1s linear;
    }

    /* CONTENEDOR DE LA FOTO Y EL VISUALIZADOR */
    .foto-container {
        position: relative;
        width: 150px;
        height: 150px;
        margin: 0 auto 20px auto;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    img {
        border-radius: 50%;
        border: 4px solid #2ecc71;
        width: 150px;
        height: 150px;
        object-fit: cover;
        z-index: 10;
        position: relative;
        box-shadow: 0px 0px 20px rgba(46, 204, 112, 0.6);
    }

    /* LAS BARRAS DEL VISUALIZADOR */
    #spectrum {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 5; /* Detrás de la foto */
    }

    .bar {
        position: absolute;
        bottom: 50%;
        left: 50%;
        width: 4px;
        background: #2ecc71;
        transform-origin: bottom center;
        border-radius: 2px;
        opacity: 0.5;
        transition: height 0.05s ease;
    }

    .modo-fiesta-activa {
        background: rgba(255, 255, 255, 0.1) !important;
        border-color: #fff !important;
    }

    a {
        color: #2ecc71;
        text-decoration: none;
        font-weight: bold;
        display: inline-block;
        margin: 15px 0;
    }

    .musica-box {
        margin-top: 25px;
        padding: 15px;
        background: rgba(46, 204, 113, 0.1);
        border-radius: 12px;
        border: 1px dashed #2ecc71;
    }

    audio {
        width: 100%;
        height: 30px;
        filter: invert(100%) hue-rotate(90deg) brightness(1.5);
    }

    .contador-nuevo {
        margin-top: 20px;
        font-size: 10px;
        color: #2ecc71;
        letter-spacing: 2px;
    }

    #num-visitas {
        font-size: 22px;
        display: block;
        font-weight: bold;
        color: #fff;
        text-shadow: 0 0 10px #2ecc71;
    }

    .hojas-container {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: -1;
        pointer-events: none;
    }

    .hoja {
        position: absolute;
        top: -50px;
        font-size: 25px;
        animation: caer linear infinite;
    }

    @keyframes caer {
        0% { transform: translateY(0) rotate(0deg); opacity: 1; }
        100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
</style>
</head>
<body>
    <div id="glow"></div>

    <div class="hojas-container">
        <div class="hoja" style="left: 15%; animation-duration: 5s;">🌿</div>
        <div class="hoja" style="left: 45%; animation-duration: 8s;">🌿</div>
        <div class="hoja" style="left: 80%; animation-duration: 6s;">🌿</div>
    </div>

    <div class="tarjeta" id="miTarjeta">
        
        <div class="foto-container">
            <div id="spectrum"></div> <img src="Captura.PNG" alt="Foto Francis"> 
        </div>

        <h1> Soy Francis </h1>
        <p style="font-size: 12px;">La quiebra activa - Beats Reales</p>
        
        <a href="https://www.instagram.com/benites_francis/" target="_blank">📸 IR A MI INSTAGRAM</a>
        
        <div class="musica-box">
            <p id="statusMusica" style="font-size: 10px;">🎵 DALE PLAY PARA VER EL ESPECTRO</p>
            <audio id="track" controls crossorigin="anonymous">
                <source src="watussi.mp3" type="audio/mpeg">
            </audio>
        </div>

        <div class="contador-nuevo">
            VECES VISITADA
            <span id="num-visitas">0000</span>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN ---
        const audio = document.getElementById('track');
        const tarjeta = document.getElementById('miTarjeta');
        const status = document.getElementById('statusMusica');
        const glow = document.getElementById('glow');
        const spectrum = document.getElementById('spectrum');
        
        // --- 2. GENERAR LAS 60 BARRAS ---
        const totalBarras = 60;
        const radio = 85; // Distancia desde el centro
        
        for (let i = 0; i < totalBarras; i++) {
            let bar = document.createElement('div');
            bar.classList.add('bar');
            
            // Calcular rotación para formar el círculo
            let angle = (360 / totalBarras) * i;
            bar.style.transform = `rotate(${angle}deg) translateY(-${radio}px)`;
            
            spectrum.appendChild(bar);
        }
        
        const barras = document.querySelectorAll('.bar');

        // --- 3. AUDIO VISUALIZER ---
        let audioCtx, analyser, dataArray, source;

        function activarVisualizador() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                source = audioCtx.createMediaElementSource(audio);
                analyser = audioCtx.createAnalyser();
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                
                // 64 puntos de datos para las 60 barras (sobran 4, no pasa nada)
                analyser.fftSize = 128; 
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                loopVisual();
            } catch(e) { console.log("Error Audio:", e); }
        }

        function loopVisual() {
            requestAnimationFrame(loopVisual);
            analyser.getByteFrequencyData(dataArray);

            // Mover cada barra según su frecuencia
            barras.forEach((bar, i) => {
                let valor = dataArray[i] || 0;
                let altura = (valor / 255) * 60; // Altura máxima 60px
                
                // Si la música está fuerte, cambiamos color
                if (valor > 180) {
                    bar.style.backgroundColor = "#e74c3c"; // Rojo
                    bar.style.boxShadow = "0 0 10px #e74c3c";
                } else {
                    bar.style.backgroundColor = "#2ecc71"; // Verde normal
                    bar.style.boxShadow = "none";
                }
                
                // Aplicar altura
                bar.style.height = `${5 + altura}px`; 
            });
            
            // Vibración de la tarjeta con los bajos (índices bajos del array)
            let bajos = dataArray[2]; 
            if (bajos > 200) {
                tarjeta.style.transform = `scale(1.02)`;
            } else {
                tarjeta.style.transform = `scale(1)`;
            }
        }

        // --- 4. EVENTOS ---
        audio.onplay = () => {
            activarVisualizador();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            tarjeta.classList.add('modo-fiesta-activa');
            status.innerText = "🔥 ¡ESPECTRO ACTIVADO! 🔥";
            document.body.style.background = "#000";
            glow.style.background = "radial-gradient(circle, rgba(231, 76, 60, 0.3) 0%, rgba(0, 0, 0, 0) 70%)";
        };

        audio.onpause = () => {
            tarjeta.classList.remove('modo-fiesta-activa');
            status.innerText = "🎵 ESCUCHANDO: WATUSSI";
            document.body.style.background = "linear-gradient(135deg, #0a1a0a 0%, #1a3a1a 100%)";
            glow.style.background = "radial-gradient(circle, rgba(46, 204, 113, 0.15) 0%, rgba(0, 0, 0, 0) 70%)";
        };

        // --- 5. EXTRAS (Contador y Mouse) ---
        let visitas = localStorage.getItem('visitas_francis') || 0;
        visitas = parseInt(visitas) + 1;
        localStorage.setItem('visitas_francis', visitas);
        document.getElementById('num-visitas').innerText = visitas.toString().padStart(4, '0');

        document.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });
    </script>
</body> 
</html>
